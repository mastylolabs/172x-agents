[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "172x-agents"
version = "0.1.0"
description = "Markdown-first composable agent workflows for Codex."
authors = [{ name = "Mastylo Labs LLC", email = "zbigniew@mastylolabs.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://forge.172x.ai/"
Documentation = "https://forge.172x.ai/"
Repository = "https://github.com/mastylolabs/172x-agents"
Issues = "https://github.com/mastylolabs/172x-agents/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[project.scripts]
172x-agents = "agent_workflows.agents_cli:main"
agents = "agent_workflows.agents_cli:main"

[project.entry-points."172x.commands"]
agents = "agent_workflows.agents_cli:create_app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_workflows = ["library/**/*.md", "library/**/*.mmd", "library/**/*.toml", "library/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
