name: Release standalone 172X Agents

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PYINSTALLER_VERSION: "6.20.0"
  PYINSTALLER_HOOKS_VERSION: "2026.6"

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-13
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.18"

      - name: Install project dependencies
        run: uv sync --all-extras --frozen

      - name: Build standalone executable
        shell: bash
        run: |
          uv run \
            --with "pyinstaller==${PYINSTALLER_VERSION}" \
            --with "pyinstaller-hooks-contrib==${PYINSTALLER_HOOKS_VERSION}" \
            pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name agents \
            --paths src \
            --collect-all agent_workflows \
            --distpath build/standalone \
            --workpath build/pyinstaller \
            --specpath build/spec \
            scripts/standalone_entrypoint.py

      - name: Package archive and checksum
        shell: bash
        run: |
          binary="build/standalone/agents"
          if [[ "${{ matrix.target }}" == "windows-x64" ]]; then
            binary="build/standalone/agents.exe"
          fi
          python scripts/package_release.py \
            --binary "$binary" \
            --target "${{ matrix.target }}" \
            --output-dir release

      - name: Upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create release manifest
        run: |
          sha256sum release/agents-*.tar.gz release/agents-*.zip > release/SHA256SUMS
          python scripts/release_manifest.py create \
            --version "${GITHUB_REF_NAME}" \
            --artifacts-dir release \
            --base-url "https://agents.172x.ai/releases/${GITHUB_REF_NAME}" \
            --output release/manifest.json
          python scripts/release_manifest.py verify \
            --manifest release/manifest.json \
            --artifacts-dir release

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            install.sh install.ps1 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "172X Agents ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
